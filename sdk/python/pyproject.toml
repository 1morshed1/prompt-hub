[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prompthub-sdk"
version = "0.1.0"
description = "Python client for PromptHub — version-controlled, A/B-tested LLM prompts."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "1morshed1" }]
keywords = ["llm", "prompts", "prompt-engineering", "ab-testing", "versioning"]
# Zero runtime dependencies by design: the SDK uses only the standard library.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["prompthub*"]
